# EXAMINI web: the SPA plus a same-origin /api proxy to the API gateway (no CORS in production).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Question images/audio, answer recordings and document imports are uploaded through the API.
  client_max_body_size 25m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # nginx drops server-level add_header in any location that sets its own, so every location includes the same set.
  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz { access_log off; return 200 "ok"; }

  location /api/ {
    # Resolve the gateway through Docker DNS on every lookup window, so a restarted gateway with a new address is
    # found again (a literal host in proxy_pass is resolved only once, at nginx start).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway api-gateway:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: the gateway rate limit keys on this address, so a client must not be able to choose it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The SPA and /api share one origin, so a browser Origin equal to this site is not a cross-origin call: drop it,
    # whatever host name people use (localhost, LAN IP, domain). Real cross-origin calls keep their Origin for CORS.
    set $proxied_origin $http_origin;
    if ($http_origin = "http://$http_host") { set $proxied_origin ""; }
    if ($http_origin = "https://$http_host") { set $proxied_origin ""; }
    proxy_set_header Origin $proxied_origin;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;   # AI generation and OCR imports can take minutes
  }

  # Hashed build assets and face models never change for a given URL.
  location /assets/ { include /etc/nginx/snippets/security-headers.conf; expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location /models/ { expires 30d; try_files $uri =404; }
  # The service worker and the app shell must always be revalidated.
  location = /sw.js { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location / { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}

map $http_upgrade $connection_upgrade { default upgrade; '' close; }
