jwt:
  secret: ${JWT_SECRET:}
exam:
  internal-token: ${EXAM_INTERNAL_TOKEN:}
  capacity:
    platform-limit: ${EXAM_PLATFORM_CONCURRENT_LIMIT:100}
question-bank:
  internal-token: ${QB_INTERNAL_TOKEN:}

server:
  port: 8083

spring:
  application:
    name: exam-service
  datasource:
    url: jdbc:postgresql://localhost:5432/exam_db
    username: datn
    password: ${POSTGRES_PASSWORD:datn_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:redis_secret}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

notification:
  internal-token: ${EXAM_NOTIFICATION_TOKEN:}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/exam_db
  data:
    redis:
      host: redis

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
