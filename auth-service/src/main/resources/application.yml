server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: datn
    password: ${POSTGRES_PASSWORD:datn_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate       # Flyway quản lý schema, không để Hibernate tự tạo
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:redis_secret}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}
  access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
  refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}

auth:
  google:
    # OAuth 2.0 Web client id(s) from Google Cloud Console, comma separated. Blank = Google sign-in off.
    client-ids: ${GOOGLE_CLIENT_ID:}
  bootstrap:
    email: ${AUTH_BOOTSTRAP_EMAIL:}
    password: ${AUTH_BOOTSTRAP_PASSWORD:}
  internal:
    # Credential riêng cho Notification gọi POST /auth/internal/contacts; trống = từ chối mọi request.
    notification-contact-token: ${NOTIFICATION_CONTACT_TOKEN:}
    # Credential riêng cho POST /auth/internal/identities/resolve; trống/trùng credential khác = bị vô hiệu.
    organization-identity-token: ${ORGANIZATION_IDENTITY_TOKEN:}
    exam-identity-token: ${EXAM_IDENTITY_TOKEN:}
    question-bank-identity-token: ${QUESTION_BANK_IDENTITY_TOKEN:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/auth_db
  data:
    redis:
      host: redis

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
