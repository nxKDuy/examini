name: CI

on:
  push:
    branches: [main, huynhdai5656]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven, Java 21)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ["1025:1025", "8025:8025"]
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity" --health-interval 10s --health-timeout 10s --health-retries 12
    env:
      AUTH_TEST_DATABASE: "true"
      ORG_TEST_DATABASE: "true"
      QB_TEST_DATABASE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tesseract OCR (dùng cho test nhập câu hỏi từ ảnh)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-vie
      - name: Tạo database cho test
        run: |
          for d in auth_test org_test qb_test exam_test exam_legacy session_test session_legacy grading_test analytics_test notification_test; do
            psql -h localhost -U postgres -c "CREATE DATABASE $d"
          done
      - name: Test từng service
        run: |
          set -e
          for svc in eureka-server api-gateway auth-service organization-service question-bank-service exam-service exam-session-service grading-service analytics-service notification-service; do
            echo "::group::$svc"
            case $svc in
              auth-service) db=auth_test ;;
              organization-service) db=org_test; export ORGANIZATION_DB_URL=jdbc:postgresql://localhost:5432/org_test ;;
              question-bank-service) db=qb_test ;;
              *) db= ;;
            esac
            if [ -n "$db" ]; then
              SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/$db SPRING_DATASOURCE_USERNAME=postgres SPRING_DATASOURCE_PASSWORD= \
                mvn -B -q -f $svc/pom.xml test
            else
              mvn -B -q -f $svc/pom.xml test
            fi
            echo "::endgroup::"
          done
      - name: Báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.txt"
          if-no-files-found: ignore

  frontend:
    name: Frontend (type check, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --pretty false
      - run: npx oxlint
      - name: Unit test
        run: node --test tests/*.test.mjs
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build toàn bộ image
        run: cp .env.example .env && docker compose build
