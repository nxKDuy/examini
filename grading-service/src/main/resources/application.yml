jwt:
  secret: ${JWT_SECRET:}
exam:
  internal-token: ${EXAM_INTERNAL_TOKEN:}
  capacity:
    platform-limit: ${EXAM_PLATFORM_CONCURRENT_LIMIT:100}
question-bank:
  internal-token: ${QB_INTERNAL_TOKEN:}

server:
  port: 8085

spring:
  application:
    name: grading-service
  datasource:
    url: jdbc:postgresql://localhost:5432/grading_db
    username: datn
    password: ${POSTGRES_PASSWORD:datn_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

gemini:
  api:
    key: ${GEMINI_API_KEY:demo-key}

management:
  endpoints:
    web:
      exposure:
        include: health, info

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/grading_db
  rabbitmq:
    host: rabbitmq

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
