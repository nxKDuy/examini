jwt:
  secret: ${JWT_SECRET:}

# Secrets come only from the local environment; blank values fail closed.
organization:
  invitation-ttl-days: 7
  internal:
    # Dedicated Question Bank credential (contracts/organization-authorization.md).
    qb-token: ${ORG_AUTHZ_QB_TOKEN:}
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    identity-token: ${ORGANIZATION_IDENTITY_TOKEN:}
  events:
    enabled: true
    outbox-poll-ms: 1000
    expiry-sweep-ms: 60000

server:
  port: 8088

spring:
  application:
    name: organization-service
  datasource:
    url: ${ORGANIZATION_DB_URL:jdbc:postgresql://localhost:5432/organization_db}
    username: ${POSTGRES_USER:datn}
    password: ${POSTGRES_PASSWORD:datn_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${ORGANIZATION_DB_URL:jdbc:postgresql://postgres:5432/organization_db}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}

organization:
  auth:
    base-url: ${AUTH_SERVICE_URL:http://auth-service:8081}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
