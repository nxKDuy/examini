# Empty credentials disable authentication lanes; MAIN provisions runtime secrets.
jwt:
  secret: ${JWT_SECRET:}
question-bank:
  internal-token: ${QB_INTERNAL_TOKEN:}
  identity-token: ${QUESTION_BANK_IDENTITY_TOKEN:}
  # AI question generation; blank key disables it (GET /question-imports/ai/status → available=false).
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
    timeout-seconds: ${QB_AI_TIMEOUT_SECONDS:120}
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
organization:
  authorization:
    url: ${ORGANIZATION_SERVICE_URL:http://localhost:8088}
    token: ${ORG_AUTHZ_QB_TOKEN:}

server:
  port: 8082

spring:
  application:
    name: question-bank-service
  datasource:
    url: jdbc:postgresql://localhost:5432/question_bank_db
    username: datn
    password: ${POSTGRES_PASSWORD:datn_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/question_bank_db

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
