jwt:
  secret: ${JWT_SECRET:}
exam:
  internal-token: ${EXAM_INTERNAL_TOKEN:}
  integrity:
    events-per-minute: ${INTEGRITY_EVENTS_PER_MINUTE:120}
    max-events-per-session: ${INTEGRITY_MAX_EVENTS_PER_SESSION:10000}
  capacity:
    platform-limit: ${EXAM_PLATFORM_CONCURRENT_LIMIT:100}
  # Camera proctoring evidence (snapshots + recordings) on a local volume.
  camera:
    storage-dir: ${CAMERA_STORAGE_DIR:${java.io.tmpdir}/examini-camera}
    events-per-minute: ${CAMERA_EVENTS_PER_MINUTE:30}
    max-events-per-session: ${CAMERA_MAX_EVENTS_PER_SESSION:2000}
    # Snapshots and video are deleted this many days after the attempt's deadline (0 = keep forever).
    retention-days: ${CAMERA_RETENTION_DAYS:30}
    retention-cron: ${CAMERA_RETENTION_CRON:0 30 3 * * *}
question-bank:
  internal-token: ${QB_INTERNAL_TOKEN:}

server:
  port: 8084

spring:
  application:
    name: exam-session-service
  datasource:
    url: jdbc:postgresql://localhost:5432/exam_session_db
    username: datn
    password: ${POSTGRES_PASSWORD:datn_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 400KB
      max-request-size: 500KB
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:redis_secret}
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    host: localhost
    port: 5672
    username: guest
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/exam_session_db
  data:
    redis:
      host: redis
  rabbitmq:
    host: rabbitmq

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
